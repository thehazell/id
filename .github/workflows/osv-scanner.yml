name: OSV-Scanner

on:
  pull_request:
    branches: [main]

  merge_group:
    branches: [main]

  push:
    branches: [main]

  schedule:
    - cron: "16 13 * * 6"

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Verify lockfile
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f bun.lock ]]; then
            echo "::error::bun.lock is missing"
            exit 1
          fi

          if [[ "$(git ls-files -s -- bun.lock | awk '{print $1}')" == "120000" ]]; then
            echo "::error::bun.lock must not be a symbolic link"
            exit 1
          fi

      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile=bun.lock
            --format=sarif
            --output-file=osv-results.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3.30.3
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner

      - name: Fail if vulnerabilities were found
        if: steps.osv.outcome == 'failure'
        run: |
          echo "::error::OSV-Scanner found one or more vulnerabilities."
          exit 1
