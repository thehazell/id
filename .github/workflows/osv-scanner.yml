name: OSV-Scanner

on:
  pull_request:
    branches: [main]

  merge_group:
    branches: [main]

  push:
    branches: [main]

  schedule:
    - cron: "16 13 * * 6"

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Verify lockfile
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f bun.lock ]]; then
            echo "::error::bun.lock is missing"
            exit 1
          fi

          if [[ "$(git ls-files -s -- bun.lock | awk '{print $1}')" == "120000" ]]; then
            echo "::error::bun.lock must not be a symbolic link"
            exit 1
          fi

      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@baa4139e56d6312335d899e6ba045fa16d1d3d0b # v2.5.1
        with:
          scan-args: |-
            --lockfile=bun.lock
            --format=sarif
            --output-file=/tmp/osv-results.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3.30.3
        with:
          sarif_file: /tmp/osv-results.sarif
          category: osv-scanner
